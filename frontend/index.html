<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AssetFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
      </span>
      AssetFlow
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="assets">Assets</button>
      <button class="tab" role="tab" data-view="employees">Employees</button>
    </nav>
    <a class="docs-link" href="/docs" target="_blank" rel="noopener">API docs</a>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1 id="page-title">Assets</h1>
        <p id="page-subtitle" class="muted">Track every device your team owns.</p>
      </div>
      <button id="add-btn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span id="add-label">Add asset</span>
      </button>
    </div>

    <section id="stats" class="stats"></section>

    <section class="card">
      <div class="toolbar">
        <div class="search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search…" autocomplete="off">
        </div>
        <span id="count" class="muted small"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden></div>
    </section>
  </main>

  <dialog id="dialog">
    <form id="form" novalidate>
      <div class="dialog-head">
        <h2 id="dialog-title">Add asset</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div id="fields" class="fields"></div>
      <p id="form-error" class="form-error" hidden></p>
      <div class="dialog-foot">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="save-btn">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="assign-dialog">
    <form id="assign-form" novalidate>
      <div class="dialog-head">
        <div>
          <h2 id="assign-title">Assign asset</h2>
          <p id="assign-subtitle" class="muted small dialog-sub"></p>
        </div>
        <button type="button" class="icon-btn" data-close aria-label="Close">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="fields">
        <div class="field full">
          <label for="assign-employee">Employee<span class="req">*</span></label>
          <select id="assign-employee"></select>
        </div>
        <div class="field full">
          <label for="assign-notes">Notes</label>
          <input id="assign-notes" type="text" placeholder="Optional, e.g. New hire laptop" autocomplete="off">
        </div>
      </div>
      <p id="assign-error" class="form-error" hidden></p>
      <div class="dialog-foot">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" id="assign-btn">Assign</button>
      </div>
    </form>
  </dialog>

  <dialog id="history-dialog">
    <div class="dialog-head">
      <div>
        <h2 id="history-title">History</h2>
        <p id="history-subtitle" class="muted small dialog-sub"></p>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="history-body" class="history"></div>
    <div class="dialog-foot">
      <button type="button" class="btn" data-close>Close</button>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="confirm">
    <div class="dialog-head">
      <h2 id="confirm-title">Are you sure?</h2>
    </div>
    <p id="confirm-message" class="confirm-message muted"></p>
    <div class="dialog-foot">
      <button type="button" class="btn" id="confirm-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="confirm-ok">Confirm</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
